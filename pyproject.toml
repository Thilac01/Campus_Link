[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campuslink"
version = "0.2.0"
description = "Local-first university communication and collaboration desktop application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CampusLink contributors" }]
dependencies = [
    "cryptography>=44,<47",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[project.scripts]
campuslink = "campuslink.app.main:main"

[tool.setuptools.packages.find]
include = ["campuslink*"]

[tool.setuptools.package-data]
"campuslink.database" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["campuslink"]
